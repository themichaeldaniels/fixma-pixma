name: pixma_fixa
description: "Local diagnostics and maintenance for the Canon PIXMA G7020."
publish_to: 'none'
version: 0.9.0-beta.2+16

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/protocol.json
    - assets/sample-report.txt
  fonts:
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
        - asset: assets/fonts/SourceSans3-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
